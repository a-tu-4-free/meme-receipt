<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民眾堂系統 vNEXT // MEME CORE</title>
<style>
/* ==================== CSS ==================== */
* { box-sizing: border-box; }
html, body {
    margin: 0; padding: 0;
    background: radial-gradient(circle at top, #0b1220, #020617);
    color: #e5e7eb;
    font-family: "Microsoft JhengHei", "Segoe UI", Arial, sans-serif;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(251,191,36,0.035), rgba(251,191,36,0.035) 2px, transparent 2px, transparent 4px);
    z-index: 0;
    pointer-events: none;
}

.topbar {
    background: linear-gradient(135deg, #1e2937, #0f172a);
    padding: 20px 15px;
    text-align: center;
    border-bottom: 4px solid #f59e0b;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.topbar .logo {
    font-size: 29px;
    font-weight: bold;
    color: #fbbf24;
    text-shadow: 0 0 15px rgba(245,158,11,0.6);
    letter-spacing: 2px;
}
.topbar .sub {
    font-size: 15px;
    color: #94a3b8;
    letter-spacing: 1.5px;
}

.panel {
    max-width: 1280px;
    margin: 0 auto;
    padding: 15px;
    position: relative;
    z-index: 2;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-bottom: 20px;
}
.buttons button {
    flex: 1 1 28%;
    min-width: 145px;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 900;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: linear-gradient(145deg, #f59e0b, #b45309);
    color: #0b1220;
    box-shadow: 0 6px 0 #0b1220;
    transition: all 0.15s ease;
}
.buttons button:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 0 #0b1220, 0 0 20px rgba(245,158,11,0.4);
}

#receiptContainer {
    display: flex;
    flex-direction: row;
    gap: 28px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 30px 0;
}

.receipt {
    width: 375px;
    max-width: 100%;
    background: #f8fafc;
    color: #0f172a;
    padding: 24px;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    transition: all 0.35s ease;
}
.receipt:hover {
    transform: translateY(-10px);
}
.receipt.tangkou {
    border: 4px solid #fbbf24;
    box-shadow: 0 25px 70px rgba(251,191,36,0.45);
}
.receipt.jackpot {
    animation: jackpotPulse 1.3s infinite alternate;
    border-color: #eab308;
}

@keyframes jackpotPulse {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
}

.modal {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.85);
    z-index: 99999;
    padding: 20px;
}
.modal-box {
    width: min(520px, 95%);
    background: #0f172a;
    color: white;
    border: 2px solid #f59e0b;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 0 30px rgba(0,0,0,0.7);
}
.modal-title {
    font-size: 19px;
    font-weight: bold;
    color: #fbbf24;
    margin-bottom: 12px;
}
.modal-buttons {
    margin-top: 20px;
    display: flex;
    gap: 12px;
}
.modal-buttons button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}
.modal-buttons button:first-child {
    background: #f59e0b;
    color: black;
}
.modal-buttons button:last-child {
    background: #1f2937;
    color: white;
}

.high-salary { color: #f59e0b; font-weight: bold; }
.angry { color: #f87171; font-weight: bold; }
.thanks { color: #4ade80; font-weight: bold; }

/* 大獎閃光動畫 */
@keyframes jackpotFlash {
    0% { opacity: 0.35; }
    100% { opacity: 0; }
}
</style>
</head>
<body>

<div class="topbar">
    <div class="logo">2026KProfiteering.tw SYSTEM vNEXT</div>
    <div class="sub">崩壞生成器 • 語意污染模式 • 雙太陽堂口系統</div>
</div>

<div class="panel">
    <div class="buttons">
        <button onclick="randomMoney()">🎲 隨機撈錢</button>
        <button onclick="tangkouMode()">☀ 堂口模式</button>
        <button onclick="doubleSunMode()" style="background: linear-gradient(135deg, #ca8a04, #f59e0b); color: black; font-weight: bold;">
            🔥 雙太陽模式
        </button>
        <button onclick="showEvidenceModal()">⬇ 留下證據</button>
        <button onclick="upgradeMode()">💰 錢再多一點</button>
    </div>

    <div style="margin-top:15px; text-align:center;">
        <input id="userInput" placeholder="輸入內容（例如：系統正在查帳 / 我懷疑異常）"
               style="width: 95%; padding: 14px; border: 2px solid #1e2937; border-radius: 10px; font-size: 15px; background: #0b1220; color: white;">
        <button onclick="buildMemeFromInput()"
                style="margin-top:10px; width:95%; background: linear-gradient(135deg,#111827,#1f2937); color:#fbbf24; border:none; padding:14px; font-size:16px; border-radius:10px; font-weight:bold;">
            🤖 雙標解析系統
        </button>
    </div>

    <div id="playerHUD" style="margin:15px; padding:12px; background:#0f172a; border:1px solid #334155; border-radius:10px; color:#fbbf24; font-size:13px; text-align:center;">
        等級：<span id="hudLevel">LV1</span> |
        混亂值：<span id="hudChaos">87</span> |
        系統穩定度：<span id="hudStability">100%</span>
    </div>

    <div id="systemComment" style="margin:15px; font-size:16px; color:#fbbf24; text-align:center; min-height:32px;"></div>
    
    <div id="receiptContainer"></div>
    
    <div style="text-align:center; margin-top:10px; color:#64748b; font-size:12px;">
        左側：隨機奉獻　｜　右側：堂口高層
    </div>
</div>

<!-- 收據模板 -->
<template id="receiptTemplate">
    <div class="receipt">
        <div class="header">
            <div class="title">SYSTEM OUTPUT TERMINAL</div>
            <div class="warning">MEME ENGINE ACTIVE • REALITY DISTORTION ENABLED</div>
        </div>
        <div class="info">
            <div>收據編號：<span class="rid"></span></div>
            <div>收款時間：<span class="rtime"></span></div>
            <div>奉獻金額：NT$ <span class="rmoney"></span></div>
            <div>堂口高層：<span class="rhighsalary high-salary"></span></div>
            <div>高層實領：NT$ <span class="ractual"></span></div>
            <div>查帳逾時：<span class="rclock"></span></div>
        </div>
        <div class="divider"></div>
        <div class="content result"></div>
        <div class="comparison"></div>
        <div class="divider"></div>
        <div class="footer">
            MEME CORE SYSTEM<br>
            「你看到的現金，不是給阿北」<br>
            「阿北只是轉手」
        </div>
    </div>
</template>

<!-- 留下證據 Modal -->
<div id="evidenceModal" class="modal">
  <div class="modal-box">
    <div class="modal-title">留下證據</div>
    <div class="modal-content" style="text-align:center; line-height:1.6;">
        選擇你要的方式：
    </div>
    <div class="modal-buttons">
      <button onclick="copyLinkAndInfo()">📋 複製連結和截圖，扛得住特偵組嗎</button>
      <button onclick="saveAsJPG()">💾 儲存為阿北手撕手寫稿</button>
      <button onclick="closeEvidenceModal()" style="background:#334155;">取消</button>
    </div>
  </div>
</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script type="module">
import {
    genRandomMoney,
    genTangkouMoney,
    genTangkouName,
    isJackpotTriggered,
    markJackpotTriggered,
    genThanksMessage,
    genAngryMessage,
    genComment
} from "./generator.js";

import { renderReceiptsUI, renderCommentUI, triggerJackpotEffect } from "./ui.js";

// ==================== STATE ====================
let memes = null;
let memesReady = false;
let currentReceipts = [];
let gameState = { chaos: 0, stability: 100, level: 1, clicks: 0, modeLock: null };
let userPoints = 87;

// ==================== 點數系統 ====================
function loadPoints() {
    const today = new Date().toISOString().split('T')[0];
    if (localStorage.getItem('lastReset') !== today) {
        userPoints = 87;
        localStorage.setItem('lastReset', today);
    } else {
        const saved = localStorage.getItem('memePoints');
        if (saved) userPoints = parseInt(saved);
    }
    updateHUD();
}

function savePoints() {
    localStorage.setItem('memePoints', userPoints);
}

function updateHUD() {
    document.getElementById('hudLevel').textContent = `LV${gameState.level}`;
    document.getElementById('hudChaos').textContent = userPoints;
}

function checkPoints(cost) {
    if (userPoints < cost) {
        alert(`點數不足！目前剩下 ${userPoints} 點`);
        return false;
    }
    userPoints -= cost;
    savePoints();
    updateHUD();
    return true;
}

// ==================== 超級大獎 ====================
function checkJackpot(type) {
    if (isJackpotTriggered()) {
        markJackpotTriggered();
        triggerJackpotEffect();
        alert("🎉【超級大獎觸發！】今天手氣爆表！");
        gameState.modeLock = "GLITCH";
        return true;
    }
    return false;
}

// ==================== 主要功能 ====================
window.randomMoney = function () {
    if (!memesReady || !checkPoints(7)) return;
    checkJackpot("random");
    gameState.clicks++;
    gameState.chaos += 5;
    currentReceipts = [{
        type: "random",
        money: genRandomMoney().toLocaleString(),
        highSalary: genTangkouName(),
        actualSalary: (Math.floor(Math.random() * 80000) + 10000).toLocaleString(),
        comparison: Math.random() > 0.5 ? `<div class="thanks">${genThanksMessage()}</div>` : `<div class="angry">${genAngryMessage()}</div>`
    }];
    renderAll();
};

window.tangkouMode = function () {
    if (!memesReady || !checkPoints(17)) return;
    checkJackpot("tangkou");
    gameState.clicks++;
    gameState.chaos += 8;
    currentReceipts = [{
        type: "tangkou",
        money: genTangkouMoney().toLocaleString(),
        highSalary: genTangkouName(),
        actualSalary: (Math.floor(Math.random() * 80000) + 10000).toLocaleString(),
        comparison: Math.random() > 0.5 ? `<div class="thanks">${genThanksMessage()}</div>` : `<div class="angry">${genAngryMessage()}</div>`
    }];
    renderAll();
};

window.doubleSunMode = function () {
    if (!memesReady || !checkPoints(15)) return;
    currentReceipts = [
        {
            type: "random",
            money: genRandomMoney().toLocaleString(),
            highSalary: genTangkouName(),
            actualSalary: (Math.floor(Math.random() * 80000) + 10000).toLocaleString(),
            comparison: Math.random() > 0.5 ? `<div class="thanks">${genThanksMessage()}</div>` : `<div class="angry">${genAngryMessage()}</div>`
        },
        {
            type: "tangkou",
            money: genTangkouMoney().toLocaleString(),
            highSalary: genTangkouName(),
            actualSalary: (Math.floor(Math.random() * 80000) + 10000).toLocaleString(),
            comparison: Math.random() > 0.5 ? `<div class="thanks">${genThanksMessage()}</div>` : `<div class="angry">${genAngryMessage()}</div>`
        }
    ];
    renderAll();
};

window.upgradeMode = function () {
    if (gameState.level >= 10) {
        renderCommentUI(`<span class="angry">LV10 已經夠肥了，不要太貪心</span>`);
        return;
    }
    checkJackpot("upgrade");
    gameState.level++;
    userPoints += 25;
    savePoints();
    updateHUD();
    renderCommentUI(`<span class="high-salary">✅ 升級成功！目前 LV${gameState.level}，獲得25點獎勵</span>`);
};

function renderAll() {
    const container = document.getElementById("receiptContainer");
    const template = document.getElementById("receiptTemplate");
    renderReceiptsUI(container, template, currentReceipts);
    renderCommentUI(genComment());
}

// ==================== 其他功能 ====================
window.showEvidenceModal = () => document.getElementById('evidenceModal').style.display = "flex";
window.closeEvidenceModal = () => document.getElementById('evidenceModal').style.display = "none";

window.copyLinkAndInfo = function () {
    const text = `民眾堂 MEME CORE 收據\n${location.href}\n${new Date().toLocaleString('zh-TW')}`;
    navigator.clipboard.writeText(text).then(() => alert("已複製！"));
    closeEvidenceModal();
};

window.saveAsJPG = async function () {
    closeEvidenceModal();
    const container = document.getElementById("receiptContainer");
    if (!container.children.length) return alert("請先生成收據！");
    const canvas = await html2canvas(container, {scale: 2});
    const link = document.createElement("a");
    link.download = `民眾堂收據_${new Date().toISOString().slice(0,10)}.jpg`;
    link.href = canvas.toDataURL("image/jpeg", 0.95);
    link.click();
};

window.buildMemeFromInput = function () {
    const input = document.getElementById("userInput").value.trim();
    if (!input) return alert("請輸入內容");
    if (!checkPoints(10)) return;
    currentReceipts = [{
        type: "tangkou",
        money: genTangkouMoney().toLocaleString(),
        highSalary: genTangkouName(),
        actualSalary: (Math.floor(Math.random() * 80000) + 10000).toLocaleString(),
        comparison: `<div class="angry">雙標解析：${input}</div>`
    }];
    renderAll();
};

// ==================== INIT ====================
document.addEventListener("DOMContentLoaded", () => {
    loadPoints();
    console.log("🚀 民眾堂 vNEXT 已啟動");
});
</script>

</body>
</html>
