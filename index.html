<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民眾堂系統 vNEXT // MEME CORE</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- TOP -->
<div class="panel">

<!-- ================= BUTTONS ================= -->
<div class="buttons">

    <button onclick="setMode('random')">🎲 隨機撈錢</button>
    <button onclick="setMode('tangkou')">☀ 堂口模式</button>

    <button onclick="toggleDoubleSun()" id="doubleSunBtn">
        🌞 雙太陽 OFF
    </button>

    <button onclick="upgrade()">💰 錢再多一點</button>

    <button onclick="openEvidence()">📦 留下證據</button>
</div>

<!-- HUD -->
<div id="hud">
模式：<span id="mode">-</span> |
Lv：<span id="level">0</span> |
混亂值：<span id="chaos">0</span>
</div>

<!-- SYSTEM TEXT -->
<div id="systemComment"></div>

<!-- OUTPUT -->
<div id="receiptContainer"></div>

</div>

<!-- TEMPLATE -->
<template id="receiptTemplate">
<div class="receipt">

    <div>MEME CORE SYSTEM</div>
    <hr>

    <div>收據格式：<span class="rid"></span></div>
    <div>捐款時間：<span class="rtime"></span></div>

    <div>捐款金額：NT$ <span class="rmoney"></span></div>
    <div>高層代表：<span class="rhigh"></span></div>
    <div>高層薪水：NT$ <span class="ractual"></span></div>

    <hr>

    <div class="result"></div>

    <div class="footer" id="footerText">
        MEME CORE SYSTEM
    </div>

</div>
</template>

<!-- MODAL -->
<div id="introModal" class="modal">
  <div class="modal-box">
    <div class="modal-title">SYSTEM BOOT</div>
    <div class="modal-content">
MEME CORE 啟動
是否進入堂口雙標收據系統？
    </div>
    <div class="modal-buttons">
      <button onclick="enter(true)">想奉獻，則進入</button>
      <button onclick="enter(false)">想不開，則離開</button>
    </div>
  </div>
</div>

<!-- evidence modal -->
<div id="evidenceModal" class="modal">
  <div class="modal-box">
    <div class="modal-title">留下證據，可以避免被阿北牽拖</div>
    <div class="modal-content">
選擇操作：
    </div>
    <div class="modal-buttons">
      <button onclick="sharePack()">複製連結+圖片分享給你的小草朋友</button>
      <button onclick="downloadShot()">下載截圖，可避免特偵組對你問A答B</button>
      <button onclick="closeEvidence()">取消</button>
    </div>
  </div>
</div>

<!-- scripts -->
<script type="module" src="script.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>
window.onload = () => {
    document.getElementById("introModal").style.display = "flex";
};

window.enter = (ok) => {
    document.getElementById("introModal").style.display = "none";
};

window.setMode = (m) => {
    window.gameMode = m;
    document.getElementById("mode").innerText = m;
};

window.upgrade = () => {
    if (!window.level) window.level = 0;
    window.level++;
    document.getElementById("level").innerText = window.level;

    if (window.level >= 10) {
        document.body.innerHTML = "<h1 style='color:red;text-align:center;padding:50px'>SYSTEM LOCKED</h1>";
    }
};

window.openEvidence = () => {
    document.getElementById("evidenceModal").style.display = "flex";
};

window.closeEvidence = () => {
    document.getElementById("evidenceModal").style.display = "none";
};

window.downloadShot = () => {
    html2canvas(document.querySelector(".receipt")).then(canvas => {
        let a = document.createElement("a");
        a.href = canvas.toDataURL();
        a.download = "meme.png";
        a.click();
    });
};

window.sharePack = async () => {
    await navigator.clipboard.writeText(location.href);
    alert("已複製連結");
};
</script>

</body>
</html>
