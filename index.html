<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民眾堂系統 vNEXT</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topbar">
    <div class="logo">民眾堂系統終端 vNEXT</div>
    <div class="sub">AI迷因生成 • 系統模擬中 • 非現實運算模式</div>
</div>

<div class="panel">

    <!-- ================= 操作區 ================= -->
    <div class="buttons">

        <button onclick="generate()">🎲 隨機生成</button>
        <button onclick="spam()">⚡ 系統洗版</button>
        <button onclick="spamBlack()">☠ 崩壞模式</button>
        <button onclick="download()">⬇ 下載圖像</button>

    </div>

    <!-- ================= 新增：玩家輸入 ================= -->
    <div style="margin-top:15px; text-align:center;">

        <input id="userInput"
               placeholder="輸入一句話，例如：系統正在查帳 / 我懷疑有問題"
               style="
                    width: 95%;
                    padding: 12px;
                    border: 2px solid #1e2937;
                    border-radius: 8px;
                    font-size: 15px;
               ">

        <button onclick="buildMemeFromInput()"
                style="
                    margin-top:10px;
                    width:95%;
                    background:#111827;
                    color:white;
                    border:none;
                    padding:12px;
                    font-size:16px;
                    border-radius:8px;
                ">
            🤖 AI 系統解析
        </button>

    </div>

    <!-- ================= 社群 ================= -->
    <div class="share-buttons">
        <button onclick="shareToFB()" class="social-btn">f</button>
        <button onclick="shareToX()" class="social-btn">𝕏</button>
        <button onclick="shareToThreads()" class="social-btn">t</button>
        <button onclick="shareToIG()" class="social-btn">📷</button>
    </div>

    <!-- ================= 收據 ================= -->
    <div id="receipt">

        <div class="header">
            <div class="title">系統運算輸出介面</div>
            <div class="warning">SYSTEM MODE ACTIVE • MEME ENGINE RUNNING</div>
        </div>

        <div class="info">
            <div>系統編號：<span id="rid"></span></div>
            <div>執行時間：<span id="rtime"></span></div>
            <div>隨機數值：NT$ <span id="rmoney"></span></div>
            <div>匿名等級：<span id="rlevel"></span></div>
            <div>系統運行時間：<span id="rclock"></span></div>
        </div>

        <div class="divider"></div>

        <div class="content" id="result">
            請輸入內容或按下生成開始運算...
        </div>

        <div class="divider"></div>

        <div class="footer">
            SYSTEM CORE<br>
            「資料正在被重新定義」<br>
            「你看到的不一定是真實」
        </div>

    </div>
</div>

<!-- ================= 初始 Modal ================= -->
<div id="introModal" class="modal">
  <div class="modal-box">

    <div class="modal-title">SYSTEM BOOT SEQUENCE</div>

    <div class="modal-content">
偵測到非正常資料流...

SYSTEM正在初始化迷因運算核心

- 模糊資料已啟用
- 敘事重構中
- 語意漂移允許

是否進入系統？
    </div>

    <div class="modal-buttons">
      <button onclick="enterSystem(true)">進入系統</button>
      <button onclick="enterSystem(false)">退出</button>
    </div>

  </div>
</div>

<!-- ================= scripts ================= -->
<script src="script.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

// modal
window.onload = () => {
    document.getElementById("introModal").style.display = "flex";
};

function enterSystem(ok){
    document.getElementById("introModal").style.display = "none";
    if(ok) initSystem();
    else document.getElementById("result").innerHTML =
        "SYSTEM SHUTDOWN";
}

function initSystem(){
    updateClock();
    generate();
}

</script>

</body>
</html>
