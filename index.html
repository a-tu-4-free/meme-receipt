<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>民眾堂捐款收據系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
    <div class="logo">民眾堂捐款收據系統</div>
    <div class="sub">v2.1 • 已自動匿名化 • 資料模糊化處理中 • 憑證補正進行式</div>
</div>

<div class="panel">
    <div class="buttons">
        <button onclick="generate()">產生神聖收據</button>
        <button onclick="spam()">一般洗版</button>
        <button onclick="spamBlack()">查帳黑毒洗版</button>
        <button onclick="download()">下載圖片</button>
        
        <!-- 社群分享按鈕 -->
        <button onclick="shareToFB()" style="background:#1877f2; color:white;">FB</button>
        <button onclick="shareToX()" style="background:#000; color:white;">𝕏</button>
        <button onclick="shareToThreads()" style="background:#000; color:white;">Threads</button>
    </div>

    <div id="receipt">
        <div class="header">
            <div class="title">民眾堂政治獻金收據（非正式・查帳進行中）</div>
            <div class="warning">※ 本文件由系統自動生成 • 已進入不可追溯模式 • 有人會搞定司法</div>
        </div>
     
        <div class="info">
            <div>收據編號：<span id="rid"></span></div>
            <div>生成時間：<span id="rtime"></span></div>
            <div>捐款金額：NT$ <span id="rmoney" class="highlight"></span></div>
            <div>捐款人姓名：<span id="donor">已匿名化處理</span></div>
            <div>匿名等級：<span id="rlevel" class="highlight"></span></div>
        </div>

        <div class="divider"></div>

        <div class="content" id="result">
            點擊上方按鈕開始生成柯學金句...
        </div>

        <div class="divider"></div>

        <div class="footer">
            民眾堂資料處理中心<br>
            「我從來沒有改變立場」<br>
            「士可殺不可辱 • 我會很快樂」<br>
            本文件僅供娛樂與迷因用途 • 認真的你就輸了
        </div>
    </div>
</div>

<script src="script.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>
// ==================== 進入頁面先跳出的查帳提示 ====================
window.onload = function() {
    const alertMsg = `【民眾堂系統緊急警報】

偵測到政治獻金帳務嚴重異常！
系統已自動進入「不可追溯模式」……

記者會現場直播：
端木正：「這只是帳務處理的小瑕疵而已」
柯文哲：「方向是對的，只是憑證還沒對齊」
應曉薇：「我會很快樂，真的！」

目前正在滾動式補正憑證中……
有人會搞定司法，請放心。

是否繼續進入「神聖收據生成系統」？`;

    if (confirm(alertMsg)) {
        console.log("✅ 使用者確認進入系統");
        initSystem();
    } else {
        document.getElementById("result").innerHTML = `
            <span style="color:#b91c1c; font-size:18px; line-height:1.8;">
                已取消進入系統。<br><br>
                「士可殺不可辱」<br>
                「我不會屈服」<br><br>
                你真的要臨陣脫逃嗎？<br>
                刷新頁面即可重新嘗試。
            </span>`;
    }
};

// 初始化系統
function initSystem() {
    if (typeof generate === "function") {
        generate();
    } else {
        document.getElementById("result").innerHTML = "系統初始化完成，請點擊上方按鈕開始生成。";
    }
}

// ==================== 社群分享功能 ====================
function shareToFB() {
    const url = encodeURIComponent(window.location.href);
    const text = encodeURIComponent("民眾堂查帳收據生成器太好笑了！方向是對的，只是憑證還沒對齊 😂");
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}&quote=${text}`, '_blank');
}

function shareToX() {
    const url = encodeURIComponent(window.location.href);
    const text = encodeURIComponent("來玩民眾堂政治獻金收據！有人會搞定司法系列 😂");
    window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
}

function shareToThreads() {
    const url = encodeURIComponent(window.location.href);
    const text = encodeURIComponent("民眾堂收據生成器超荒謬！端木正表示這只是小瑕疵 😂");
    window.open(`https://www.threads.net/intent/post?text=${text}%20${url}`, '_blank');
}
</script>

</body>
</html>
