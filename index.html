<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民眾堂系統 vNEXT // MEME CORE</title>
<link rel="stylesheet" href="style.css">
<style>
/* ===== modal ===== */
.modal{
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.75);
    z-index: 99999;
    padding: 20px;
}
.modal-box{
    width: min(520px, 95%);
    background: #0f172a;
    color: white;
    border: 2px solid #f59e0b;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
}
.modal-title{
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #f59e0b;
}
.modal-content{
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-line;
    opacity: 0.9;
}
.modal-buttons{
    margin-top: 15px;
    display: flex;
    gap: 10px;
}
.modal-buttons button{
    flex: 1;
    padding: 10px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    border-radius: 8px;
}
.modal-buttons button:first-child{
    background: #f59e0b;
    color: black;
}
.modal-buttons button:last-child{
    background: #1f2937;
    color: white;
}

/* ==================== 重點修改 ==================== */
/* 收據容器 */
#receiptContainer{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    min-height: 400px;
    padding: 20px 0;
}

/* 雙太陽模式：並排顯示 */
#receiptContainer.double {
    flex-direction: row;
    align-items: flex-start;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}

.receipt {
    width: 100%;
    max-width: 520px;
    background: rgba(255,255,255,0.97);
    color: #0f172a;
    padding: 32px 28px;
    border-radius: 18px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.65),
                inset 0 0 0 1px rgba(245, 158, 11, 0.15);
    margin: 0 auto;
    transition: transform 0.2s;
}

.receipt:hover {
    transform: translateY(-8px);
}

/* 柯文哲風格 */
.receipt.ko {
    border: 3px solid #15803d;
}
.receipt.ko .title { color: #15803d; }

/* 黃國昌風格 */
.receipt.huang {
    border: 3px solid #b91c1c;
}
.receipt.huang .title { color: #b91c1c; }

/* 高層薪水與文字樣式 */
.high-salary {
    color: #c2410c;
    font-weight: bold;
    font-size: 1.08em;
}
.thanks {
    color: #15803d;
    font-weight: bold;
}
.angry {
    color: #b91c1c;
    font-weight: bold;
}
.warning-text {
    color: #b45309;
    font-size: 15px;
}

/* 比較區塊 */
.comparison {
    margin: 22px 0;
    padding: 18px;
    border-radius: 12px;
    background: #fefce8;
    border: 1px solid #fde047;
}
</style>
</head>
<body>

<!-- ================= TOP ================= -->
<div class="topbar">
    <div class="logo">2026KProfiteering.tw SYSTEM vNEXT</div>
    <div class="sub">崩壞生成器 • 語意污染模式 • 非真實運算</div>
</div>

<div class="panel">
    <!-- ================= 操作 ================= -->
    <div class="buttons">
        <button onclick="generate()">🎲 隨機撈錢</button>
        <button onclick="spam()">⚡ 堂口洗錢</button>
        <button onclick="spamBlack()">☠ 雙太陽模式</button>
        <button onclick="download()">⬇ 留下證據</button>
        <button onclick="upgradeMode()">🔥 錢再多一點</button>
    </div>

    <!-- ================= INPUT ================= -->
    <div style="margin-top:15px; text-align:center;">
        <input id="userInput"
               placeholder="輸入內容（例如：系統正在查帳 / 我懷疑異常 / 政策出現錯誤）"
               style="width: 95%; padding: 14px; border: 2px solid #1e2937; border-radius: 10px; font-size: 15px; outline: none; background: #0b1220; color: white;">
        <button onclick="buildMemeFromInput()"
                style="margin-top:10px; width:95%; background: linear-gradient(135deg,#111827,#1f2937); color:#fbbf24; border:none; padding:14px; font-size:16px; border-radius:10px; font-weight:bold; cursor:pointer;">
            🤖 雙標解析系統
        </button>
    </div>

    <!-- ================= SHARE ================= -->
    <div class="share-buttons">
        <button onclick="shareToFB()" class="social-btn">f</button>
        <button onclick="shareToX()" class="social-btn">𝕏</button>
        <button onclick="shareToThreads()" class="social-btn">t</button>
        <button onclick="shareToIG()" class="social-btn">📷</button>
    </div>

    <div id="playerHUD" style="margin:15px; padding:10px; background:#0f172a; border:1px solid #334155; border-radius:10px; color:#fbbf24; font-size:13px; text-align:center;">
        等級：<span id="hudLevel">LV1</span> |
        混亂值：<span id="hudChaos">0</span> |
        系統穩定度：<span id="hudStability">100%</span>
    </div>

    <!-- ================= 系統吐槽 ================= -->
    <div id="systemComment" style="margin:15px; font-size:16px; color:#fbbf24; text-align:center;"></div>

    <!-- ================= OUTPUT ================= -->
    <div id="receiptContainer"></div>
  
    <div style="text-align:center;margin-top:15px;color:#64748b;font-size:13px;">
        點擊收據可以觸發系統反應
    </div>
</div>

<!-- ================= TEMPLATE ================= -->
<template id="receiptTemplate">
    <div class="receipt">
        <div class="header">
            <div class="title">SYSTEM OUTPUT TERMINAL</div>
            <div class="warning">MEME ENGINE ACTIVE • REALITY DISTORTION ENABLED</div>
        </div>
        <div class="info">
            <div>收據編號：<span class="rid"></span></div>
            <div>收款時間：<span class="rtime"></span></div>
            <div>奉獻金額：NT$ <span class="rmoney"></span></div>
            <div>堂口高層：<span class="rhighsalary high-salary"></span></div>
            <div>高層實領：NT$ <span class="ractual"></span></div>
            <div>查帳逾時：<span class="rclock"></span></div>
        </div>
        <div class="divider"></div>
        <div class="content result"></div>
        <div class="comparison"></div>
        <div class="divider"></div>
        <div class="footer">
            MEME CORE SYSTEM<br>
            「你看到的現金，不是給阿北」<br>
            「阿北只是轉手」
        </div>
    </div>
</template>

<!-- ================= BOOT MODAL ================= -->
<div id="introModal" class="modal">
  <div class="modal-box">
    <div class="modal-title">SYSTEM BOOT SEQUENCE</div>
    <div class="modal-content">
偵測到非正常語意流
MEME CORE 正在啟動：
- 會計師顧問系統
- 律師訴訟系統
- 2026民眾堂募款計劃
是否進入雙標系統？
    </div>
    <div class="modal-buttons">
      <button onclick="enterSystem(true)">進入系統</button>
      <button onclick="enterSystem(false)">拒絕進入（系統會記住你）</button>
    </div>
  </div>
</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script type="module" src="script.js"></script>

<script>
// 全域變數
let currentLevel = 1;
const maxLevel = 99;

const highLevelNames = [
    "蟑螂小姊姊", "阿北轉手哥", "白襪會計師", "小牛文宣", "珊珊基金會",
    "壁如姐的包", "虹安竹北幫", "國昌咆哮組", "文哲葉克膜", "智菡直播間",
    "黃珊珊幽靈帳", "高虹安快遞", "蔡壁如顧問", "林珍珍的錢", "柯P睡眠醫學中心",
    "黃國昌正義聯盟", "民眾黨洗錢小組", "阿北的幽靈員工", "智菡的千萬顧問費",
    "小牛的消失帳戶", "珊珊的特別費", "壁如的海外帳", "國昌的憤怒基金"
];

// 隨機生成高層名稱
function getRandomHighLevelName() {
    return highLevelNames[Math.floor(Math.random() * highLevelNames.length)];
}

// 更新 HUD
function updateHUD() {
    document.getElementById("hudLevel").textContent = `LV${currentLevel}`;
    document.getElementById("hudChaos").textContent = `${Math.min(99, currentLevel * 8)}`;
    document.getElementById("hudStability").textContent = `${Math.max(5, 100 - currentLevel * 9)}%`;
}

// 產生單張收據
function createReceipt(isKo = false, isHuang = false) {
    const template = document.getElementById("receiptTemplate");
    const receipt = template.content.cloneNode(true).querySelector(".receipt");

    const rid = "M" + String(Math.floor(100000 + Math.random() * 900000));
    const now = new Date();
    const rtime = now.toLocaleString('zh-TW', { hour12: false });

    const money = Math.floor(888888 + Math.random() * 8888888);
    const actual = Math.floor(money * (0.12 + Math.random() * 0.25));

    receipt.querySelector(".rid").textContent = rid;
    receipt.querySelector(".rtime").textContent = rtime;
    receipt.querySelector(".rmoney").textContent = money.toLocaleString('zh-TW');
    receipt.querySelector(".rhighsalary").textContent = getRandomHighLevelName();
    receipt.querySelector(".ractual").textContent = actual.toLocaleString('zh-TW');
    receipt.querySelector(".rclock").textContent = `${Math.floor(3 + Math.random() * 27)} 小時`;

    // 根據風格加入 class
    if (isKo) receipt.classList.add("ko");
    if (isHuang) receipt.classList.add("huang");

    // 點擊事件
    receipt.addEventListener("click", () => {
        alert("系統偵測到現金流異常！\n\n雙標引擎已記錄此操作。");
    });

    return receipt;
}

// 隨機撈錢（單張）
function generate() {
    const container = document.getElementById("receiptContainer");
    container.innerHTML = "";
    container.classList.remove("double");

    const receipt = createReceipt();
    container.appendChild(receipt);
    
    document.getElementById("systemComment").innerHTML = "🎲 系統已成功撈取一筆政治現金";
}

// 堂口洗錢（單張加強版）
function spam() {
    const container = document.getElementById("receiptContainer");
    container.innerHTML = "";
    container.classList.remove("double");

    const receipt = createReceipt();
    container.appendChild(receipt);
    
    document.getElementById("systemComment").innerHTML = "⚡ 堂口洗錢模式啟動，現金流已成功模糊化";
}

// 雙太陽模式（重點修改）
function spamBlack() {
    const container = document.getElementById("receiptContainer");
    container.innerHTML = "";
    container.classList.add("double");

    const koReceipt = createReceipt(true, false);
    const huangReceipt = createReceipt(false, true);

    container.appendChild(koReceipt);
    container.appendChild(huangReceipt);

    document.getElementById("systemComment").innerHTML = "☠ 雙太陽模式啟動<br>柯文哲風格 & 黄國昌風格 同時運作";
}

// 錢再多一點（升級系統）
function upgradeMode() {
    if (currentLevel < maxLevel) {
        currentLevel++;
        updateHUD();
        
        const chaos = Math.min(99, currentLevel * 8);
        const stability = Math.max(5, 100 - currentLevel * 9);
        
        let comment = `🔥 等級提升至 LV${currentLevel}！<br>`;
        comment += `混亂值：${chaos} | 穩定度：${stability}%`;

        if (currentLevel > 30) comment += "<br><span class='angry'>系統即將失控...</span>";
        if (currentLevel > 60) comment += "<br><span class='warning-text'>警告：現實扭曲指數嚴重超標</span>";
        if (currentLevel > 90) comment += "<br><span class='angry'>MEME CORE 已完全崩壞</span>";

        document.getElementById("systemComment").innerHTML = comment;

        // 自動產生一張高級收據
        const container = document.getElementById("receiptContainer");
        container.innerHTML = "";
        container.classList.remove("double");

        const receipt = createReceipt();
        container.appendChild(receipt);
    } else {
        document.getElementById("systemComment").innerHTML = "⚠️ 已達到最高等級 LV99，系統即將完全失控";
    }
}

// 其他功能（占位，後續 script.js 會覆蓋或補完）
function download() {
    alert("已截圖並儲存證據至本地（模擬）");
}

function buildMemeFromInput() {
    const input = document.getElementById("userInput").value.trim();
    if (!input) {
        alert("請輸入內容");
        return;
    }
    const container = document.getElementById("receiptContainer");
    container.innerHTML = "";
    container.classList.remove("double");

    const receipt = createReceipt();
    receipt.querySelector(".result").innerHTML = `<strong>雙標解析結果：</strong><br>${input}<br><br>系統判定：這是標準操作，沒問題。`;
    container.appendChild(receipt);
    
    document.getElementById("systemComment").textContent = "🤖 雙標解析系統已完成分析";
}

function shareToFB() { alert("已模擬分享至 Facebook"); }
function shareToX() { alert("已模擬分享至 X"); }
function shareToThreads() { alert("已模擬分享至 Threads"); }
function shareToIG() { alert("已模擬分享至 Instagram"); }

function enterSystem(enter) {
    document.getElementById("introModal").style.display = "none";
    if (enter) {
        document.getElementById("systemComment").innerHTML = "MEME CORE 已成功啟動，歡迎來到雙標世界";
        generate(); // 預設產生一張
    } else {
        document.getElementById("systemComment").innerHTML = "你已被系統列入黑名單";
    }
}

// 初始化
window.onload = () => {
    document.getElementById("introModal").style.display = "flex";
    updateHUD();
};
</script>

</body>
</html>
